el facts, promises.</text><rect x="1160" y="164" width="52" height="30" rx="15" fill="none" stroke="var(--accent)"/><text x="1186" y="185" text-anchor="middle" font-size="15" font-weight="600" fill="var(--accent)">Gate</text><line x1="610" x2="1208" y1="212" y2="212" stroke="var(--line)"/><text x="610" y="250" font-size="22" font-weight="600" fill="var(--accent)">3</text><text x="646" y="250" font-size="26" font-weight="600" fill="var(--ink)" letter-spacing="-.3">Planning</text><text x="824" y="250" font-size="21" fill="var(--muted)">Small tickets, one goal each.</text><line x1="610" x2="1208" y1="276" y2="276" stroke="var(--line)"/><text x="610" y="314" font-size="22" font-weight="600" fill="var(--accent)">4</text><text x="646" y="314" font-size="26" font-weight="600" fill="var(--ink)" letter-spacing="-.3">Setup</text><text x="824" y="314" font-size="21" fill="var(--muted)">Guardrails before the first feature.</text><line x1="610" x2="1208" y1="340" y2="340" stroke="var(--line)"/><text x="610" y="378" font-size="22" font-weight="600" fill="var(--accent)">5</text><text x="646" y="378" font-size="26" font-weight="600" fill="var(--ink)" letter-spacing="-.3">Build loop</text><text x="824" y="378" font-size="21" fill="var(--muted)">One ticket, one branch, one reviewed PR.</text><line x1="610" x2="1208" y1="404" y2="404" stroke="var(--line)"/><text x="610" y="442" font-size="22" font-weight="600" fill="var(--accent)">6</text><text x="646" y="442" font-size="26" font-weight="600" fill="var(--ink)" letter-spacing="-.3">Field test</text><text x="824" y="442" font-size="21" fill="var(--muted)">Real people, real devices.</text><line x1="610" x2="1208" y1="468" y2="468" stroke="var(--line)"/><text x="610" y="506" font-size="22" font-weight="600" fill="var(--accent)">7</text><text x="646" y="506" font-size="26" font-weight="600" fill="var(--ink)" letter-spacing="-.3">Learn</text><text x="824" y="506" font-size="21" fill="var(--muted)">Every correction becomes a rule.</text><line x1="610" x2="1208" y1="532" y2="532" stroke="var(--line)"/><text x="610" y="570" font-size="22" font-weight="600" fill="var(--accent)">8</text><text x="646" y="570" font-size="26" font-weight="600" fill="var(--ink)" letter-spacing="-.3">Release</text><text x="824" y="570" font-size="21" fill="var(--muted)">A tagged version with notes.</text>
