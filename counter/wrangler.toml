name = "framework-counter"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# No request logs, no traces: the counter must not keep anything about who called it.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "framework-counter"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
